[workspace]
resolver = "2"
members = [
    "crates/r2il",
    "crates/r2sleigh-lift",
    "crates/r2sleigh-export",
    "crates/r2sleigh-cli",
    "crates/r2ssa",
    "crates/r2sym",
    "crates/r2types",
    "crates/r2engine",
    "crates/r2dec",
    "r2plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"
authors = ["radare2 contributors", "0verflowme"]
repository = "https://github.com/0verflowme/r2sleigh"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
thiserror = "2.0"
clap = { version = "4", features = ["derive"] }
libsla = "1.2"
sleigh-config = "1.0"
serde_json = "1"
hex = "0.4"
z3 = "0.20.0"

[profile.release]
# Keep everyday release builds fast enough for local iteration and CI.
# Use `--profile dist` when a maximum-optimized distributable artifact is needed.
lto = false
codegen-units = 16
panic = "abort"
strip = true

[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
