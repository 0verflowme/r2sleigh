[package]
name = "r2sleigh-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C-ABI plugin for radare2 integration"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
r2il = { path = "../crates/r2il" }
r2source = { path = "../crates/r2source" }
r2sleigh-lift = { path = "../crates/r2sleigh-lift", default-features = false }
r2sleigh-export = { path = "../crates/r2sleigh-export" }
r2ssa = { path = "../crates/r2ssa" }
r2sym = { path = "../crates/r2sym" }
r2types = { path = "../crates/r2types" }
r2engine = { path = "../crates/r2engine" }
serde.workspace = true
serde_json.workspace = true
z3.workspace = true

[dev-dependencies]
r2dec = { path = "../crates/r2dec" }
r2engine = { path = "../crates/r2engine" }
sha2 = "0.10"

[build-dependencies]
cbindgen = "0.29"

[dependencies.sleigh-config]
workspace = true
optional = true

[features]
default = ["x86"]
x86 = ["sleigh-config/x86", "r2sleigh-lift/x86"]
arm = ["sleigh-config/ARM", "sleigh-config/AARCH64", "r2sleigh-lift/arm"]
mips = ["sleigh-config/MIPS", "r2sleigh-lift/mips"]
riscv = ["sleigh-config/RISCV", "r2sleigh-lift/riscv"]
all-archs = ["x86", "arm", "mips", "riscv"]
