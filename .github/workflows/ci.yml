name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Self-hosted runner optimization: persist incremental build artifacts
  # across jobs/runs to avoid repeatedly recompiling the full workspace.
  CARGO_TARGET_DIR: /tmp/r2sleigh-target

jobs:
  # ── Quality checks (single compile pipeline) ───────────────────────
  quality:
    name: Format + Clippy + Unit Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust PATH
        run: |
          for p in "$HOME/.cargo/bin" "/root/.cargo/bin" "/usr/local/cargo/bin"; do
            if [ -d "$p" ]; then
              echo "$p" >> "$GITHUB_PATH"
              export PATH="$p:$PATH"
            fi
          done
          if ! command -v cargo &>/dev/null; then
            echo "::error::cargo not found. See scripts/setup-runner.sh"
            exit 1
          fi
      - name: Prepare shared target dir
        run: mkdir -p "$CARGO_TARGET_DIR"
      - name: Print versions
        run: |
          echo "rustc:      $(rustc --version)"
          echo "cargo:      $(cargo --version)"
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --all-features

  # ── Fast snapshot tests (r2r) ───────────────────────────────────────
  r2r:
    name: Snapshot Tests (r2r)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust PATH
        run: |
          for p in "$HOME/.cargo/bin" "/root/.cargo/bin" "/usr/local/cargo/bin"; do
            if [ -d "$p" ]; then
              echo "$p" >> "$GITHUB_PATH"
              export PATH="$p:$PATH"
            fi
          done
          if ! command -v cargo &>/dev/null; then
            echo "::error::cargo not found. See scripts/setup-runner.sh"
            exit 1
          fi
      - name: Prepare shared target dir
        run: mkdir -p "$CARGO_TARGET_DIR"
      - name: Ensure radare2 + headers
        run: |
          check_radare2() {
            command -v r2 >/dev/null &&
            command -v r2r >/dev/null &&
            pkg-config --exists r_anal &&
            r2 -v >/dev/null 2>&1 &&
            R2R_OFFLINE=1 r2r -n -L tests/r2r/db/extras >/dev/null 2>&1
          }

          RADARE2_REPO_URL="https://github.com/radareorg/radare2"
          RADARE2_CACHE_DIR="/tmp/radare2"
          RADARE2_INSTALL_REF_FILE="$RADARE2_CACHE_DIR/.r2sleigh-installed-ref"
          RADARE2_REMOTE_REF="$(git ls-remote "$RADARE2_REPO_URL" refs/heads/master | cut -f1)"

          if [ -z "$RADARE2_REMOTE_REF" ]; then
            echo "::error::Failed to resolve radare2 master ref from GitHub"
            exit 1
          fi

          RADARE2_CACHE_REF=""
          RADARE2_INSTALLED_REF=""
          if [ -d "$RADARE2_CACHE_DIR/.git" ]; then
            RADARE2_CACHE_REF="$(git -C "$RADARE2_CACHE_DIR" rev-parse HEAD 2>/dev/null || true)"
          fi
          if [ -f "$RADARE2_INSTALL_REF_FILE" ]; then
            RADARE2_INSTALLED_REF="$(cat "$RADARE2_INSTALL_REF_FILE")"
          fi

          NEED_RADARE2_INSTALL=0
          if ! check_radare2; then
            echo "radare2/r2r/headers missing or unusable"
            NEED_RADARE2_INSTALL=1
          fi
          if [ "$RADARE2_CACHE_REF" != "$RADARE2_REMOTE_REF" ]; then
            echo "radare2 cache ref mismatch: cache=${RADARE2_CACHE_REF:-missing} remote=$RADARE2_REMOTE_REF"
            NEED_RADARE2_INSTALL=1
          fi
          if [ "$RADARE2_INSTALLED_REF" != "$RADARE2_REMOTE_REF" ]; then
            echo "radare2 installed ref mismatch: installed=${RADARE2_INSTALLED_REF:-missing} remote=$RADARE2_REMOTE_REF"
            NEED_RADARE2_INSTALL=1
          fi

          if [ "$NEED_RADARE2_INSTALL" -eq 0 ]; then
            echo "radare2 install already matches GitHub master ($RADARE2_REMOTE_REF)"
          else
            echo "Refreshing radare2 from GitHub..."
            rm -rf "$RADARE2_CACHE_DIR"
            git clone --depth=1 --branch master "$RADARE2_REPO_URL" "$RADARE2_CACHE_DIR"
            echo "Installed radare2 cache ref: $(git -C "$RADARE2_CACHE_DIR" rev-parse HEAD)"
            cd "$RADARE2_CACHE_DIR" && sys/install.sh
            printf '%s\n' "$RADARE2_REMOTE_REF" > "$RADARE2_INSTALL_REF_FILE"
            cd "$GITHUB_WORKSPACE"
            check_radare2
          fi

      - name: Prepare r2r temp dir
        run: |
          # Use the runner temp area, but compute the path inside the job since
          # the `runner` context is not available in job-level `env`.
          R2R_TMPDIR="$RUNNER_TEMP/r2sleigh-r2r-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          echo "R2R_TMPDIR=$R2R_TMPDIR" >> "$GITHUB_ENV"
          rm -rf "$R2R_TMPDIR"
          mkdir -p "$R2R_TMPDIR"
      - name: Run r2r snapshot tests
        env:
          R2R_JOBS: "2"
          R2R_OFFLINE: "1"
        run: make -C tests/r2r run

  # ── Rust E2E / integration tests ────────────────────────────────────
  e2e:
    name: Rust E2E Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Run Rust E2E tests
        run: cargo e2e-test

  # ── Release build check ────────────────────────────────────────────
  release:
    name: Release Build
    runs-on: self-hosted
    needs: [quality, r2r, e2e]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust PATH
        run: |
          for p in "$HOME/.cargo/bin" "/root/.cargo/bin" "/usr/local/cargo/bin"; do
            if [ -d "$p" ]; then
              echo "$p" >> "$GITHUB_PATH"
              export PATH="$p:$PATH"
            fi
          done
          if ! command -v cargo &>/dev/null; then
            echo "::error::cargo not found. See scripts/setup-runner.sh"
            exit 1
          fi
      - name: Prepare shared target dir
        run: mkdir -p "$CARGO_TARGET_DIR"

      - name: Build release (all architectures)
        run: cargo build --release --features all-archs
      - name: Build plugin release
        run: make -C r2plugin RUST_FEATURES=all-archs
