[package]
name = "r2sleigh-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for compiling Sleigh specs to r2il"

[[bin]]
name = "r2sleigh"
path = "src/main.rs"

[dependencies]
r2il = { path = "../r2il" }
r2sleigh-lift = { path = "../r2sleigh-lift" }
r2sleigh-export = { path = "../r2sleigh-export", optional = true }
clap.workspace = true
hex = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
# Enable specific architecture support for disasm command
sleigh-config = ["dep:sleigh-config", "dep:r2sleigh-export", "dep:hex", "dep:serde_json"]
decompile = ["sleigh-config", "r2sleigh-export/dec"]
x86 = ["sleigh-config", "sleigh-config/x86"]
arm = ["sleigh-config", "sleigh-config/ARM", "sleigh-config/AARCH64"]
mips = ["sleigh-config", "sleigh-config/MIPS"]
riscv = ["sleigh-config", "sleigh-config/RISCV"]
all-archs = ["x86", "arm", "mips", "riscv", "decompile"]

[dependencies.sleigh-config]
workspace = true
optional = true
