[package]
name = "r2sym"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Symbolic execution engine for r2sleigh"

[[bench]]
name = "symex_hotpaths"
harness = false

[dependencies]
r2il = { path = "../r2il" }
r2ssa = { path = "../r2ssa" }
serde.workspace = true
thiserror.workspace = true
z3.workspace = true
r2pipe = { version = "0.7", optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = []
r2 = ["r2pipe", "serde_json"]

[dev-dependencies]
criterion = "0.5"
proptest = "1.6"
