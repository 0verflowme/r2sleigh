[package]
name = "r2ssa"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SSA (Static Single Assignment) form for r2il"

[dependencies]
r2il = { path = "../r2il" }
r2sleigh-lift = { path = "../r2sleigh-lift", default-features = false }
r2source = { path = "../r2source" }
serde.workspace = true
petgraph = "0.8"

[features]
default = []
sleigh-config = ["dep:sleigh-config"]

[dev-dependencies]
proptest = "1.6"
serde_json.workspace = true

[dependencies.sleigh-config]
workspace = true
optional = true
features = ["x86"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
