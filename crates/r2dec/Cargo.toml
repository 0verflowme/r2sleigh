[package]
name = "r2dec"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native decompiler for r2sleigh"

[dependencies]
r2cert = { path = "../r2cert" }
r2il = { path = "../r2il" }
r2ssa = { path = "../r2ssa" }
r2sym = { path = "../r2sym" }
r2types = { path = "../r2types" }
postcard.workspace = true
serde.workspace = true

[features]
default = []

[dev-dependencies]
r2sleigh-lift = { path = "../r2sleigh-lift", features = ["arm", "x86"] }
r2source = { path = "../r2source" }
serde_json.workspace = true
z3.workspace = true
